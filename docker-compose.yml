services:
  dashboard:
    build:
      context: .
    ports:
      # Bind to localhost by default: the workbench can display private
      # reports and position snapshots. Override explicitly only on a trusted LAN.
      - "127.0.0.1:${DASHBOARD_PORT:-8765}:8765"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      # Version check (the app's only outbound request; sends no local data).
      # Empty A_SHARE_VERSION falls back to the VERSION file baked into the image.
      A_SHARE_UPDATE_CHECK: ${A_SHARE_UPDATE_CHECK:-on}
      A_SHARE_VERSION: ${A_SHARE_VERSION:-}
      # auto inspects the shipped docker-compose.yml, which uses a local build.
      # Set to "image" when you run the app from a compose file that references
      # ghcr.io/luqtest/big-a-chovy, or "run" for plain docker run.
      A_SHARE_DOCKER_MODE: ${A_SHARE_DOCKER_MODE:-auto}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # These directories are intentionally local-only and are ignored by Git.
      - ./筛选结果:/app/筛选结果
      - ./决策记录:/app/决策记录
      - ./tools/shadow_data:/app/tools/shadow_data
      - dashboard_runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8765/api/status', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  dashboard_runtime:
