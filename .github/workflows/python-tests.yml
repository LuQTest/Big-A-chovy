name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  full-ubuntu:
    name: Full regression (Ubuntu)
    runs-on: ubuntu-latest
    env:
      A_SHARE_STATE_DIR: .ci-state
      A_SHARE_REPORT_DIR: .ci-reports
      A_SHARE_SHADOW_DATA_DIR: .ci-shadow
      PYTHONUTF8: '1'
      PYTHONPATH: daily-stock-analysis/scripts:tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify version consistency (VERSION / CHANGELOG / tag)
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/validate_version.py --tag "$RELEASE_TAG"
          else
            python tools/validate_version.py
          fi
      - name: Run isolated full regression
        run: python -m unittest discover -s daily-stock-analysis/scripts -p 'test_*.py'

  windows-shadow:
    name: Windows native shadow-lock acceptance
    runs-on: windows-latest
    env:
      A_SHARE_STATE_DIR: .ci-state
      A_SHARE_REPORT_DIR: .ci-reports
      A_SHARE_SHADOW_DATA_DIR: .ci-shadow
      PYTHONUTF8: '1'
      PYTHONPATH: daily-stock-analysis/scripts;tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify native Windows lock primitive
        shell: pwsh
        run: >-
          python -c "import sys, msvcrt; assert sys.platform == 'win32'; assert callable(msvcrt.locking); assert hasattr(msvcrt, 'LK_LOCK') and hasattr(msvcrt, 'LK_UNLCK')"
      - name: Run shadow tracker process-safety acceptance
        run: python -m unittest discover -s daily-stock-analysis/scripts -p 'test_shadow_tracker.py'

  windows-full-diagnostic:
    name: Windows full-suite diagnostic
    runs-on: windows-latest
    continue-on-error: true
    env:
      A_SHARE_STATE_DIR: .ci-state
      A_SHARE_REPORT_DIR: .ci-reports
      A_SHARE_SHADOW_DATA_DIR: .ci-shadow
      PYTHONUTF8: '1'
      PYTHONPATH: daily-stock-analysis/scripts;tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Windows full-suite diagnostic
        run: python -m unittest discover -s daily-stock-analysis/scripts -p 'test_*.py'
