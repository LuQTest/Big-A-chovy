name: Docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR
        required: true
        default: false
        type: boolean
      image_tag:
        description: Image tag to publish, for example v0.7.1
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 镜像 tag 就是 docker 渠道的版本标识：tag 与 VERSION 不一致时不该发布镜像，
      # 否则容器里的版本检查会拿错误的基准去比较。
      - name: Verify version consistency (VERSION / CHANGELOG / tag)
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/validate_version.py --tag "$RELEASE_TAG"
          else
            python tools/validate_version.py
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: >-
          (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luqtest/big-a-chovy
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
                (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
